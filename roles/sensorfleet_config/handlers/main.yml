---
- name: Write fleet config
  ansible.builtin.command: fleet config write -
  args:
    stdin: "{{ sensorfleet_config_new | to_yaml }}"
  register: sensorfleet_config_write_result
  until: sensorfleet_config_write_result is succeeded
  retries: "{{ sensorfleet_globals_fleet_retries }}"
  delay: "{{ sensorfleet_globals_fleet_retry_delay_seconds }}"
  changed_when: true
