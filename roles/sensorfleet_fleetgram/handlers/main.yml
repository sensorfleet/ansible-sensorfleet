---
- name: Write fleet index config
  ansible.builtin.command: fleet config direct_write /opt/fleet/etc/.ansible-sensor-index-config.json
  changed_when: true

- name: Write fleet sensor config
  ansible.builtin.command: fleet config direct_write /opt/fleet/etc/.ansible-sensor-config.json
  changed_when: true

- name: Restart UI service
  ansible.builtin.systemd:
    name: "{{ 'fm-ui' if 'fleetmgmt' in group_names else 'sensor-ui' }}"
    state: restarted
