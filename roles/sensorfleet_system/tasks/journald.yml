---
- name: Ensure /etc/systemd/journald.conf.d directory exists
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install journald configuration
  ansible.builtin.template:
    src: 00-sensorfleet.conf.j2
    dest: /etc/systemd/journald.conf.d/00-sensorfleet.conf
    owner: root
    group: root
    mode: "0644"

- name: Find files in journald.conf.d directory
  ansible.builtin.find:
    paths: /etc/systemd/journald.conf.d
    patterns: "*.conf"
  register: sensorfleet_system_journald_conf_d_files

- name: Remove unmanaged journald.conf.d files
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ sensorfleet_system_journald_conf_d_files.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  when:
    - sensorfleet_system_journald_cleanup_unmanaged_files
    - item.path | basename != '00-sensorfleet.conf'
