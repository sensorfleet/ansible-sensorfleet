---
- name: Install nginx vhost SSL certificate
  ansible.builtin.copy:
    dest: "{{ sensorfleet_nginx_sensorui_vhost_ssl_cert_path }}"
    content: "{{ sensorfleet_nginx_sensorui_vhost_ssl_cert }}"
    owner: root
    group: www-data
    mode: "0640"
  when: sensorfleet_nginx_sensorui_vhost_ssl_cert not in [none, false, '']
  notify: Reload nginx

- name: Install nginx vhost SSL key
  ansible.builtin.copy:
    dest: "{{ sensorfleet_nginx_sensorui_vhost_ssl_key_path }}"
    content: "{{ sensorfleet_nginx_sensorui_vhost_ssl_key }}"
    owner: root
    group: www-data
    mode: "0640"
  when: sensorfleet_nginx_sensorui_vhost_ssl_key not in [none, false, '']
  notify: Reload nginx

- name: Install nginx vhost SSL DH parameters
  ansible.builtin.copy:
    dest: "{{ sensorfleet_nginx_sensorui_vhost_ssl_dhparams_path }}"
    content: "{{ sensorfleet_nginx_sensorui_vhost_ssl_dhparams }}"
    owner: root
    group: root
    mode: "0640"
  when: sensorfleet_nginx_sensorui_vhost_ssl_dhparams not in [none, false, '']
  notify: Reload nginx

- name: Install nginx UI vhost SSL options
  ansible.builtin.template:
    src: nginx_ui_vhost_ssloptions.conf.j2
    dest: /etc/nginx/sensor-ui.d/00-nginx-ui-vhost-ssloptions.conf
    owner: root
    group: root
    mode: "0640"
  notify: Reload nginx

- name: Disable fleetcert FM-CA webui certificate renewal
  ansible.builtin.command: fleetcert webui renew --disable
  register: sensorfleet_nginx_webui_renew_disable
  changed_when: sensorfleet_nginx_webui_renew_disable.stderr_lines | length > 0
  failed_when: false
  when: >-
    sensorfleet_nginx_sensorui_vhost_ssl_cert not in [none, false, ''] or
    sensorfleet_nginx_sensorui_vhost_ssl_key not in [none, false, '']

# On FM, fleetcert creates or renews the FM-CA certificate only when needed and manages the
# package-provided /etc/ssl/sensorfleet/ui.crt and ui.key symlinks itself
- name: Create nginx UI certificate with fleetcert
  ansible.builtin.command: >-
    fleetcert webui cert
    {% for sensorfleet_nginx_webui_san in [sensorfleet_nginx_webui_subjectaltname] + sensorfleet_nginx_webui_additional_subjectaltnames %}
    --san {{ sensorfleet_nginx_webui_san | quote }}
    {% endfor %}
  register: sensorfleet_nginx_webui_cert
  changed_when: >-
    'No certificate creation or renewal needed at this time'
    not in sensorfleet_nginx_webui_cert.stdout
  when:
    - "'fleetmgmt' in group_names"
    - not sensorfleet_nginx_sensorui_vhost_ssl_cert_path
  notify: Reload nginx

# Custom certificate if configured, otherwise sensors use their internal certificate
- name: Create nginx UI certificate symlink
  ansible.builtin.file:
    src: >-
      {{ sensorfleet_nginx_sensorui_vhost_ssl_cert_path
         if sensorfleet_nginx_sensorui_vhost_ssl_cert_path
         else '/etc/ssl/sensorfleet/internal.crt' }}
    dest: /etc/ssl/sensorfleet/ui.crt
    state: link
  when: sensorfleet_nginx_sensorui_vhost_ssl_cert_path not in [none, false, ''] or 'fleetmgmt' not in group_names
  notify: Reload nginx

- name: Create nginx UI key symlink
  ansible.builtin.file:
    src: >-
      {{ sensorfleet_nginx_sensorui_vhost_ssl_key_path
         if sensorfleet_nginx_sensorui_vhost_ssl_cert_path
         else '/etc/ssl/sensorfleet/internal.key' }}
    dest: /etc/ssl/sensorfleet/ui.key
    state: link
  when: sensorfleet_nginx_sensorui_vhost_ssl_cert_path not in [none, false, ''] or 'fleetmgmt' not in group_names
  notify: Reload nginx

- name: Install nginx configuration
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    owner: root
    group: root
    mode: "0644"
    validate: "nginx -t -c %s"
  notify: Reload nginx

- name: Flush handlers
  ansible.builtin.meta: flush_handlers
