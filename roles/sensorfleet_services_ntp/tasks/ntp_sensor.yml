---
- name: Install systemd-timesyncd package
  ansible.builtin.apt:
    name: systemd-timesyncd
    state: present
    install_recommends: false
  register: sensorfleet_services_ntp_timesyncd_result
  until: sensorfleet_services_ntp_timesyncd_result is succeeded
  retries: "{{ sensorfleet_globals_apt_lock_retries }}"
  delay: "{{ sensorfleet_globals_apt_lock_retry_delay_seconds }}"

- name: Install systemd-timesyncd configuration
  ansible.builtin.template:
    src: timesyncd.conf.j2
    dest: /etc/systemd/timesyncd.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart systemd-timesyncd
