---
- name: Install chrony package
  ansible.builtin.apt:
    name: chrony
    state: present
    install_recommends: false
  register: sensorfleet_services_ntp_chrony_result
  until: sensorfleet_services_ntp_chrony_result is succeeded
  retries: "{{ sensorfleet_globals_apt_lock_retries }}"
  delay: "{{ sensorfleet_globals_apt_lock_retry_delay_seconds }}"

- name: Ensure /etc/chrony/chrony.d directory exists
  ansible.builtin.file:
    path: /etc/chrony/chrony.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install chrony configuration
  ansible.builtin.template:
    src: chrony.conf.j2
    dest: /etc/chrony/chrony.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart chrony
