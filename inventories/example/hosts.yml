---
# Example inventory: copy this directory as the basis for a new environment.
# Inventory hostnames must match each host's system hostname (checked by sensorfleet_sanity_checks).
all:
  vars:
    ansible_user: root
    # Address the sensors use to reach the FM's OpenVPN server
    sensorfleet_openvpn_server_connect_ip: 192.168.0.10
  children:
    fleetmgmt:
      hosts:
        fleetmanagement:
          ansible_host: 192.168.0.10
          # FM's (server) address inside the OpenVPN tunnel
          sensorfleet_openvpn_internal_ip: 169.254.255.255
    sensors:
      hosts:
        sensor001:
          ansible_host: 192.168.1.101
          # Sensor's (client) address inside the OpenVPN tunnel, unique per sensor
          sensorfleet_openvpn_internal_ip: 169.254.1.1
        sensor002:
          ansible_host: 192.168.2.102
          sensorfleet_openvpn_internal_ip: 169.254.1.2
